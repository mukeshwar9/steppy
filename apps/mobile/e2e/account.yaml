# Account flow on the iOS simulator with the REAL HealthKit read path:
# create account -> skip onboarding -> Me: "Write sample health data" (HealthKit permission sheet) ->
# 90-day import -> create group and weekly challenge -> leaderboard shows me with HealthKit steps.
# Needs a non-production build (STEPPY_PRODUCTION unset) and the API running (see README.md).
appId: com.steppy.app
env:
  API: http://localhost:3000
---
- runFlow: _signup.yaml
- tapOn: "Skip for now"
- extendedWaitUntil:
    visible: "No groups yet"
    timeout: 30000
- tapOn: "Me, tab.*"
- scrollUntilVisible:
    element: "Write sample health data"
    timeout: 20000
    centerElement: true
- tapOn: "Write sample health data"
# HealthKit permission sheet: Turn On All, Allow.
- extendedWaitUntil:
    visible: "Turn On All"
    timeout: 30000
- takeScreenshot: account-01-healthkit-sheet
- tapOn: "Turn On All"
- tapOn:
    text: "Allow"
    index: 0
# Writing ~1000 samples, reading them back and uploading 90 days takes a while.
- scrollUntilVisible:
    element: "Apple Health"
    direction: UP
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Last synced (just now|[0-9]+ min ago).*"
    timeout: 240000
- assertVisible: "Apple Health"
- assertNotVisible: ".*importing the last 90 days.*"
- takeScreenshot: account-02-me-healthkit
# Sync now works and keeps things healthy.
- tapOn: "Sync now"
- assertVisible: ".*Last synced (just now|[0-9]+ min ago).*"

# Create a group
- tapOn: "Groups, tab.*"
- tapOn: "Create a group"
- tapOn: "Office walkers"
- inputText: "E2E Walkers"
- tapOn: "Create group"
- extendedWaitUntil:
    visible: "E2E Walkers"
    timeout: 20000
- assertVisible:
    text: "Groups"
    id: BackButton
- assertVisible: "1 member"
# Leaderboard shows me with HealthKit-derived steps (week view so the number is non-zero at any hour)
- tapOn: "Week"
- extendedWaitUntil:
    visible: "Rank 1, E2E Tester.*[1-9][0-9,]* steps.*"
    timeout: 20000
- takeScreenshot: account-03-group-leaderboard

# Create a weekly challenge
- scrollUntilVisible:
    element: "\\+ New"
    timeout: 20000
- tapOn: "\\+ New"
- extendedWaitUntil:
    visible: "Start challenge"
    timeout: 20000
- tapOn: "Weekly (7 days)"
- takeScreenshot: account-04-new-challenge
- tapOn: "Start challenge"
- extendedWaitUntil:
    visible: "Standings"
    timeout: 20000
- assertVisible: "Rank 1, E2E Tester.*steps.*"
- takeScreenshot: account-05-challenge

# Sign out and back in as the same account: Apple Health stays connected, onboarding is not repeated.
- tapOn:
    id: BackButton
- tapOn:
    id: BackButton
    optional: true
- tapOn: "Me, tab.*"
- scrollUntilVisible:
    element: "Sign out"
    timeout: 20000
- tapOn: "Sign out"
- tapOn:
    text: "Sign out"
    index: 0
- extendedWaitUntil:
    visible: "Try the demo"
    timeout: 20000
- tapOn: "you@example.com"
- inputText: ${output.email}
- tapOn: "Your password"
- inputText: ${output.password}
- pressKey: Enter
- extendedWaitUntil:
    visible: "NEVER-VISIBLE-PAUSE"
    timeout: 3000
    optional: true
- tapOn:
    point: "32%,63%"
    optional: true
- extendedWaitUntil:
    visible: "E2E Walkers.*"
    timeout: 30000
- takeScreenshot: account-06-signed-back-in
- tapOn: "Me, tab.*"
- extendedWaitUntil:
    visible: "Apple Health"
    timeout: 20000
- assertVisible: ".*Last synced.*"
- takeScreenshot: account-07-me-still-connected

# Delete the account.
- scrollUntilVisible:
    element: "Delete account"
    timeout: 20000
- tapOn: "Delete account"
- tapOn:
    text: "Delete account"
    index: 0
- extendedWaitUntil:
    visible: "Try the demo"
    timeout: 30000
- takeScreenshot: account-08-after-delete
- runScript:
    file: scripts/assert-deleted.js
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
      API: ${API}
