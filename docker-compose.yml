services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: steppy
      POSTGRES_PASSWORD: steppy
      POSTGRES_DB: steppy
    ports:
      - "5432:5432"
    volumes:
      - steppy-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  steppy-postgres:
